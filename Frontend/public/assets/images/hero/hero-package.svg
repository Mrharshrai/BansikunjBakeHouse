<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a2e"/>
      <stop offset="55%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#422813"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="100%" stop-color="#f3e7d2"/>
    </radialGradient>
    <linearGradient id="jarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C445"/>
      <stop offset="100%" stop-color="#F0B448"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="320" cy="330" r="290" fill="#F6C445" opacity="0.35"/>
  <circle cx="120" cy="120" r="70" fill="#F6C445" opacity="0.5"/>
  <circle cx="540" cy="520" r="95" fill="#EBA620" opacity="0.3"/>
  <circle cx="555" cy="90" r="40" fill="#EBA620" opacity="0.4"/>
  <circle cx="70" cy="520" r="34" fill="#EBA620" opacity="0.35"/>

  <!-- plate -->
  <ellipse cx="320" cy="588" rx="235" ry="42" fill="url(#plate)" stroke="#D9C4A2" stroke-width="3"/>
  <ellipse cx="320" cy="590" rx="185" ry="26" fill="none" stroke="#E5D5B6" stroke-width="3"/>

  <!-- jar body -->
  <path d="M205 300 h230 v238 a18 18 0 0 1 -18 18 h-194 a18 18 0 0 1 -18 -18 z" fill="#F7E7C4"/>
  <path d="M205 300 h230 v238 a18 18 0 0 1 -18 18 h-194 a18 18 0 0 1 -18 -18 z" fill="url(#glass)"/>

  <!-- cookies inside jar -->
  <ellipse cx="270" cy="500" rx="52" ry="12" fill="#E6A962"/>
  <ellipse cx="360" cy="495" rx="55" ry="12" fill="#DD9A50"/>
  <ellipse cx="312" cy="475" rx="58" ry="12" fill="#E8AC6A"/>
  <ellipse cx="270" cy="455" rx="50" ry="12" fill="#D9A968"/>
  <ellipse cx="362" cy="450" rx="52" ry="12" fill="#E4A15C"/>

  <!-- cookie on top leaning -->
  <ellipse cx="316" cy="330" rx="74" ry="17" fill="#E4A15C" transform="rotate(-6 316 330)"/>
  <ellipse cx="316" cy="326" rx="74" ry="16" fill="#E6A962" transform="rotate(-6 316 326)"/>

  <!-- jar rim -->
  <rect x="185" y="282" width="270" height="30" rx="14" fill="url(#lid)"/>
  <rect x="185" y="282" width="270" height="12" rx="6" fill="#7a5233" opacity="0.55"/>

  <!-- lid knob -->
  <ellipse cx="320" cy="270" rx="58" ry="16" fill="url(#lid)"/>
  <ellipse cx="320" cy="266" rx="58" ry="15" fill="#6f4726"/>
  <ellipse cx="320" cy="272" rx="22" ry="7" fill="#9c6b39" opacity="0.7"/>

  <!-- shine on glass -->
  <path d="M218 330 v180 a10 10 0 0 0 10 10 h12 a10 10 0 0 0 10 -10 v-180 z" fill="#ffffff" opacity="0.35"/>
  <path d="M408 340 v120" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.25"/>

  <!-- floating cookie right -->
  <g transform="translate(470 240) rotate(14)">
    <ellipse cx="0" cy="0" rx="52" ry="50" fill="#E8AC6A"/>
    <ellipse cx="0" cy="0" rx="52" ry="50" fill="none" stroke="#C98644" stroke-width="4"/>
    <g fill="#4A2E1E">
      <ellipse cx="-18" cy="-12" rx="8" ry="6" transform="rotate(-20 -18 -12)"/>
      <ellipse cx="12" cy="-18" rx="7" ry="5.5" transform="rotate(15 12 -18)"/>
      <ellipse cx="22" cy="6" rx="8" ry="6" transform="rotate(40 22 6)"/>
      <ellipse cx="4" cy="18" rx="7" ry="5.5" transform="rotate(-10 4 18)"/>
      <ellipse cx="-22" cy="10" rx="6.5" ry="5" transform="rotate(30 -22 10)"/>
    </g>
  </g>

  <!-- floating cookie left -->
  <g transform="translate(150 200) rotate(-16)">
    <ellipse cx="0" cy="0" rx="44" ry="42" fill="#F0B46C"/>
    <ellipse cx="0" cy="0" rx="44" ry="42" fill="none" stroke="#C98644" stroke-width="4"/>
    <g fill="#4A2E1E">
      <ellipse cx="-15" cy="-10" rx="7" ry="5.5" transform="rotate(-20 -15 -10)"/>
      <ellipse cx="10" cy="-14" rx="6.5" ry="5" transform="rotate(15 10 -14)"/>
      <ellipse cx="17" cy="8" rx="7" ry="5.5" transform="rotate(40 17 8)"/>
      <ellipse cx="-16" cy="12" rx="6" ry="4.5" transform="rotate(30 -16 12)"/>
    </g>
  </g>

  <!-- scattered chips/nuts -->
  <g fill="#6B4423">
    <ellipse cx="105" cy="340" rx="9" ry="7" transform="rotate(30 105 340)"/>
    <ellipse cx="540" cy="330" rx="8" ry="6" transform="rotate(-25 540 330)"/>
  </g>
  <g fill="#C9944F">
    <ellipse cx="520" cy="420" rx="12" ry="8" transform="rotate(20 520 420)"/>
    <ellipse cx="130" cy="430" rx="11" ry="8" transform="rotate(-30 130 430)"/>
  </g>
  <circle cx="100" cy="280" r="7" fill="#F6C445"/>
  <circle cx="545" cy="180" r="6" fill="#EBA620"/>
</svg>
