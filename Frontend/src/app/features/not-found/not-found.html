<section class="not-found section">
  <div class="container not-found__inner">
    <p class="not-found__code">404</p>
    <h1 class="not-found__title">This cookie tin is empty</h1>
    <p class="not-found__text">
      We couldn't find the page you're looking for. It may have been moved, renamed or
      simply baked away. Let's get you back to something delicious.
    </p>
    <div class="not-found__actions">
      <a class="btn btn--primary" routerLink="/">
        <app-icon name="home" [size]="18" />
        Back to Home
      </a>
      <a class="btn btn--outline" routerLink="/products">Browse Cookies</a>
    </div>
  </div>
</section>
