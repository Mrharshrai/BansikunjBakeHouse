<section class="auth section"><div class="container"><div class="auth__card">
  <div class="auth__head"><p class="eyebrow">Join the family</p><h1 class="auth__title">Create your account</h1></div>
  @if (error(); as message) { <div class="auth__alert"><app-icon name="alert" [size]="18" /> {{ message }}</div> }
  <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group"><label for="reg-name">Full name</label><input class="form-control" id="reg-name" formControlName="full_name" placeholder="Your name" /></div>
    <div class="form-group"><label for="reg-email">Email</label><input class="form-control" id="reg-email" type="email" formControlName="email" placeholder="you@example.com" /></div>
    <div class="form-group"><label for="reg-phone">Phone (optional)</label><input class="form-control" id="reg-phone" formControlName="phone" placeholder="Phone" /></div>
    <div class="form-group"><label for="reg-password">Password</label><div class="auth__password"><input class="form-control" id="reg-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="Min 8 characters" /><button type="button" class="auth__eye" (click)="showPassword.set(!showPassword())"><app-icon name="eye" [size]="18" /></button></div></div>
    <button class="btn btn--primary btn--lg btn--block" type="submit" [disabled]="loading()"><app-icon name="user" [size]="18" /> {{ loading() ? 'Creating...' : 'Create Account' }}</button>
  </form>
  <p class="auth__switch">Already have an account? <a routerLink="/login">Login</a></p>
</div></div></section>
